services:
  backend:
    image: ${I7Y_IMAGE:?Set I7Y_IMAGE to the verified release image}
    restart: unless-stopped
    env_file:
      - ./backend.env
    environment:
      VIRTUAL_HOST: ${I7Y_DOMAIN:?Set I7Y_DOMAIN}
      VIRTUAL_PORT: '8090'
      LETSENCRYPT_HOST: ${I7Y_DOMAIN}
    expose:
      - '8090'
    volumes:
      - ./data:/pb/pb_data
    networks:
      - reverse-proxy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8090/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  reverse-proxy:
    external: true
