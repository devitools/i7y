version: '3.7'
services:
  i7y:
    image: i7y:${I7Y_VERSION:-0.1.1}
    container_name: i7y
    restart: unless-stopped
    ports:
      - '127.0.0.1:8097:8090'
    environment:
      VIRTUAL_HOST: ${I7Y_DOMAIN}
      VIRTUAL_PORT: '8090'
      LETSENCRYPT_HOST: ${I7Y_DOMAIN}
    volumes:
      - ./data:/pb/pb_data
    networks:
      - reverse-proxy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8090/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  reverse-proxy:
    external: true
