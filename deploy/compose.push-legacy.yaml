version: '3.7'
services:
  gateway:
    image: ${I7Y_PUSH_COMPAT_IMAGE:?Set I7Y_PUSH_COMPAT_IMAGE to the verified nginx image}
    restart: unless-stopped
    user: '101:101'
    environment:
      VIRTUAL_HOST: i7y-push.disk.ninja
      VIRTUAL_PORT: '8080'
      LETSENCRYPT_HOST: i7y-push.disk.ninja
    expose:
      - '8080'
    volumes:
      - ./push-legacy-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - reverse-proxy
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /run:uid=101,gid=101,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
networks:
  reverse-proxy:
    external: true
