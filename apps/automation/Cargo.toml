[package]
name = "i7y-automation"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"
cap-std = "4.0.3"

[dev-dependencies]
i7y-core = { path = "../desktop/core" }
