version: '3.7'
services:
  gateway:
    image: ${I7Y_PUSH_GATEWAY_IMAGE}
    env_file:
      - ./gateway.env
    environment:
      VIRTUAL_HOST: i7y-push.disk.ninja
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: i7y-push.disk.ninja
    expose:
      - "8080"
    networks:
      - reverse-proxy
    volumes:
      - ./data:/data
      - ./secrets:/run/secrets:ro
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
networks:
  reverse-proxy:
    external: true
