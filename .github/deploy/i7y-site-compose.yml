name: i7y-site
services:
  site:
    image: webdevops/nginx:alpine
    restart: unless-stopped
    networks:
      - reverse-proxy
    working_dir: /var/www/app
    volumes:
      - ./public:/var/www/app/public:ro
    environment:
      WEB_DOCUMENT_ROOT: /var/www/app/public
      WEB_DOCUMENT_INDEX: index.html
      VIRTUAL_HOST: i7y.devi.tools
      LETSENCRYPT_HOST: i7y.devi.tools
      LETSENCRYPT_EMAIL: i7y@devi.tools
networks:
  reverse-proxy:
    external: true
